
- name: Build and Deploy Docker Image to Kubernetes
  hosts: localhost
  connection: local

  vars:
    image_name: my-country-service
    image_tag: "16"
    dockerfile_path: "./"
    docker_registry_username: chaymajlassi
    docker_registry_password: "{{ lookup('env', 'DOCKERHUB_PWD') }}"
    kubeconfig_path: "{{ lookup('env', 'KUBECONFIG_FILE') | default('config', true) }}"
    k8s_namespace: jenkins

  tasks:
    - name: Log in to Docker Hub
      community.docker.docker_login:
        username: "{{ docker_registry_username }}"
        password: "{{ docker_registry_password }}"
        reauthorize: yes
      no_log: true

    - name: Build Docker image
      community.docker.docker_image:
        build:
          path: "{{ dockerfile_path }}"
        name: "{{ docker_registry_username }}/{{ image_name }}"
        tag: "{{ image_tag }}"
        source: build
        state: present

    - name: Push the Docker image to Docker Hub
      community.docker.docker_image:
        name: "{{ docker_registry_username }}/{{ image_name }}"
        tag: "{{ image_tag }}"
        push: yes
        source: local

    - name: Apply Kubernetes Deployment
      kubernetes.core.k8s:
        state: present
        namespace: "{{ k8s_namespace }}"
        src: deployment.yaml
        kubeconfig: "{{ kubeconfig_path }}"

    - name: Apply Kubernetes Service
      kubernetes.core.k8s:
        state: present
        namespace: "{{ k8s_namespace }}"
        src: service.yaml
        kubeconfig: "{{ kubeconfig_path }}"

    - name: Wait until the application Deployment is available
      kubernetes.core.k8s_info:
        kind: Deployment
        name: my-country-service
        namespace: "{{ k8s_namespace }}"
        kubeconfig: "{{ kubeconfig_path }}"
        wait: true
        wait_condition:
          type: Available
          status: "True"
        wait_timeout: 180

    - name: Add the prometheus-community Helm repository
      kubernetes.core.helm_repository:
        name: prometheus-community
        repo_url: https://prometheus-community.github.io/helm-charts

    - name: Install kube-state-metrics with Helm
      kubernetes.core.helm:
        name: kube-state-metrics
        chart_ref: prometheus-community/kube-state-metrics
        release_namespace: monitoring
        create_namespace: true
        kubeconfig: "{{ kubeconfig_path }}"
        update_repo_cache: true
        wait: true
        values:
          service:
            type: NodePort
            nodePort: 30080

    - name: Check that kube-state-metrics exposes its metrics
      ansible.builtin.uri:
        url: http://localhost:30080/metrics
        status_code: 200
      register: ksm_metrics
      retries: 5
      delay: 5
      until: ksm_metrics.status == 200
