
- name: Build and Deploy Docker Image to Kubernetes
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    image_name: my-country-service
    image_tag: "16"
    dockerfile_path: "./"
    docker_registry_username: chaymajlassi
    docker_registry_password: "{{ lookup('env', 'DOCKERHUB_PWD') }}"
    kubeconfig_path: "{{ lookup('env', 'KUBECONFIG_FILE') | default('config', true) }}"
    k8s_namespace: jenkins

  tasks:
    - name: Verify required environment variables
      ansible.builtin.assert:
        that:
          - docker_registry_password | length > 0
          - kubeconfig_path | length > 0
        fail_msg: "Docker password or kubeconfig is missing."

    - name: Log in to Docker Hub
      community.docker.docker_login:
        username: "{{ docker_registry_username }}"
        password: "{{ docker_registry_password }}"
        reauthorize: true
      no_log: true

    - name: Build Docker image
      community.docker.docker_image:
        name: "{{ docker_registry_username }}/{{ image_name }}"
        tag: "{{ image_tag }}"
        build:
          path: "{{ dockerfile_path }}"
        source: build
        state: present

    - name: Push Docker image to Docker Hub
      community.docker.docker_image:
        name: "{{ docker_registry_username }}/{{ image_name }}"
        tag: "{{ image_tag }}"
        push: true
        source: local

    - name: Create Kubernetes namespace
      kubernetes.core.k8s:
        name: "{{ k8s_namespace }}"
        api_version: v1
        kind: Namespace
        state: present
        kubeconfig: "{{ kubeconfig_path }}"

    - name: Apply Kubernetes Deployment
      kubernetes.core.k8s:
        state: present
        namespace: "{{ k8s_namespace }}"
        src: deployment.yaml
        kubeconfig: "{{ kubeconfig_path }}"

    - name: Apply Kubernetes Service
      kubernetes.core.k8s:
        state: present
        namespace: "{{ k8s_namespace }}"
        src: service.yaml
        kubeconfig: "{{ kubeconfig_path }}"

    - name: Wait until Deployment is available
      kubernetes.core.k8s:
        state: present
        namespace: "{{ k8s_namespace }}"
        src: deployment.yaml
        kubeconfig: "{{ kubeconfig_path }}"
        wait: true
        wait_condition:
          type: Available
          status: "True"
        wait_timeout: 180

    - name: Add Prometheus Community Helm repository
      kubernetes.core.helm_repository:
        name: prometheus-community
        repo_url: https://prometheus-community.github.io/helm-charts

    - name: Install kube-state-metrics
      kubernetes.core.helm:
        name: kube-state-metrics
        chart_ref: prometheus-community/kube-state-metrics
        release_namespace: monitoring
        create_namespace: true
        kubeconfig: "{{ kubeconfig_path }}"
        update_repo_cache: true
        wait: true
        values:
          service:
            type: NodePort
            nodePort: 30080

    - name: Wait for kube-state-metrics metrics endpoint
      ansible.builtin.uri:
        url: http://localhost:30080/metrics
        method: GET
        status_code: 200
      register: ksm_metrics
      retries: 10
      delay: 5
      until: ksm_metrics.status == 200

