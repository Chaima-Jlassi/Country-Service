---
- name: Deploy application to Kubernetes
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    image_name: my-country-service
    image_tag: "{{ lookup('env', 'BUILD_NUMBER') | default('latest', true) }}"
    docker_registry_username: chaymajlassi
    kubeconfig_path: "{{ lookup('env', 'KUBECONFIG_FILE') }}"
    k8s_namespace: jenkins

  tasks:
    - name: Verify required variables
      ansible.builtin.assert:
        that:
          - kubeconfig_path | length > 0
          - image_tag | length > 0

    - name: Create Kubernetes namespace
      kubernetes.core.k8s:
        name: "{{ k8s_namespace }}"
        api_version: v1
        kind: Namespace
        state: present
        kubeconfig: "{{ kubeconfig_path }}"

    - name: Deploy application
      kubernetes.core.k8s:
        state: present
        namespace: "{{ k8s_namespace }}"
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: my-country-service
          spec:
            replicas: 3
            selector:
              matchLabels:
                app: country-service
            template:
              metadata:
                labels:
                  app: country-service
              spec:
                containers:
                  - name: country-service-container
                    image: "{{ docker_registry_username }}/{{ image_name }}:16"
                    imagePullPolicy: Always
                    ports:
                      - containerPort: 8082
        kubeconfig: "{{ kubeconfig_path }}"

    - name: Apply Kubernetes Service
      kubernetes.core.k8s:
        state: present
        namespace: "{{ k8s_namespace }}"
        src: service.yaml
        kubeconfig: "{{ kubeconfig_path }}"

    - name: Wait until Deployment is available
      kubernetes.core.k8s:
        state: present
        namespace: "{{ k8s_namespace }}"
        kind: Deployment
        name: my-country-service
        kubeconfig: "{{ kubeconfig_path }}"
        wait: true
        wait_condition:
          type: Available
          status: "True"
        wait_timeout: 180
        wait_condition:
          type: Available
          status: "True"
        wait_timeout: 180
