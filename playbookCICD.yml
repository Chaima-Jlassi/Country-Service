---
- name: Build and Deploy Docker Image to Kubernetes
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    image_name: my-country-service
    image_tag: "{{ lookup('env', 'BUILD_NUMBER') | default('latest', true) }}"
    dockerfile_path: "./"
    docker_registry_username: chaymajlassi
    docker_registry_password: "{{ lookup('env', 'DOCKERHUB_PWD') }}"
    kubeconfig_path: "{{ lookup('env', 'KUBECONFIG_FILE') }}"
    k8s_namespace: jenkins

  tasks:
    - name: Verify required environment variables
      ansible.builtin.assert:
        that:
          - docker_registry_password | length > 0
          - kubeconfig_path | length > 0
          - image_tag | length > 0

    - name: Log in to Docker Hub
      community.docker.docker_login:
        username: "{{ docker_registry_username }}"
        password: "{{ docker_registry_password }}"
        reauthorize: true
      no_log: true

    - name: Build Docker image
      community.docker.docker_image:
        name: "{{ docker_registry_username }}/{{ image_name }}"
        tag: "{{ image_tag }}"
        build:
          path: "{{ dockerfile_path }}"
        source: build
        state: present
        force_source: true          # rebuild even if tag already exists

    - name: Push Docker image to Docker Hub
      community.docker.docker_image:
        name: "{{ docker_registry_username }}/{{ image_name }}"
        tag: "{{ image_tag }}"
        push: true
        source: local

    - name: Create Kubernetes namespace
      kubernetes.core.k8s:
        name: "{{ k8s_namespace }}"
        api_version: v1
        kind: Namespace
        state: present
        kubeconfig: "{{ kubeconfig_path }}"

    - name: Deploy application (inline definition)
      kubernetes.core.k8s:
        state: present
        namespace: "{{ k8s_namespace }}"
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: my-country-service
          spec:
            replicas: 3
            selector:
              matchLabels:
                app: country-service
            template:
              metadata:
                labels:
                  app: country-service
              spec:
                containers:
                  - name: country-service-container
                    image: "{{ docker_registry_username }}/{{ image_name }}:{{ image_tag }}"
                    imagePullPolicy: Always
                    ports:
                      - containerPort: 8082
        kubeconfig: "{{ kubeconfig_path }}"

    - name: Apply Kubernetes Service
      kubernetes.core.k8s:
        state: present
        namespace: "{{ k8s_namespace }}"
        src: service.yaml
        kubeconfig: "{{ kubeconfig_path }}"

    - name: Wait until Deployment is available
      kubernetes.core.k8s:
        state: present
        namespace: "{{ k8s_namespace }}"
        kind: Deployment
        name: my-country-service
        kubeconfig: "{{ kubeconfig_path }}"
        wait: true
        wait_condition:
          type: Available
          status: "True"
        wait_timeout: 180
