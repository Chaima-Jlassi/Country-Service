
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-country-service
  namespace: jenkins
spec:
  replicas: 3
  selector:
    matchLabels:
      app: country-service
  template:
    metadata:
      labels:
        app: country-service
    spec:
      containers:
        - name: country-service-container
          image: chaymajlassi/{{ image_name }}:{{ image_tag }}
          imagePullPolicy: Always
          ports:
            - containerPort: 8082
          resources:
            requests:
              cpu: 100m
              memory: 128Mi

